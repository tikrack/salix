# Salam ORM configuration.
#
# The engine field selects the driver and the rest of the credentials come
# from this file; no setting is hard-coded in the program.
#
#   engine = sqlite    -> uses `path`
#   engine = mysql     -> uses host, port, user, password, name
#   engine = postgres  -> uses host, port, user, password, name

[database]
engine = sqlite
path = orm_demo.db

# MySQL / MariaDB (set engine = mysql)
host = 127.0.0.1
port = 3306
user = root
password =
name = orm_demo

# PostgreSQL (set engine = postgres)
# host = 127.0.0.1
# port = 5432
# user = postgres
# password = postgres
# name = orm_demo

# Print the SQL the ORM runs.
debug = false
